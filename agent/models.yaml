# OpenRouter models per role and profile. Each role lists fallbacks in priority order.
#
# Roles:   writer  - topic maps, answers, lesson text (long generations)
#          checker - reviewers; a different model family from the writer
#          small   - classification, extraction, guardrails (short, cheap calls)
# Profile: PROFILE in .env (free | balanced); default below.
#
# On a 429 or other error the agent tries the next model of the same role. A model that
# returns 503 or times out is skipped for the rest of the conversation. A 402 (no credit)
# in a paid profile switches the session to the free profile. At startup each list is
# checked against OpenRouter's model list (cached for a day); unknown ids are skipped.
default_profile: free

# The spending cap of one run (USD); MAX_COST_USD in .env wins. Before a paid step that would
# cross it the agent asks [Y/N] (agent/cost_cap.py).
max_cost_usd: 1.5

profiles:
  free:
    # Order from evals/bench_writer.py (one group of 4 screens, 2 runs each, 19.11.2026):
    # ernie 2/2 valid, ~77 s; super-vl 2/2 valid, ~141 s; ultra 0/2 on the first try (only
    # a too-big decision diagram, fixable on the retry), ~95-140 s.
    writer:
      - baidu/ernie-5.5-flash-preview:free
      - nvidia/nemotron-3.5-super-vl:free
      - nvidia/nemotron-3-ultra-550b-a55b:free
    checker:
      - google/gemma-4-31b-it:free
      - google/gemma-4-26b-a4b-it:free
      - nvidia/nemotron-3.5-super-vl:free
    small:
      - nvidia/nemotron-3.5-lightning:free
      - google/gemma-4-26b-a4b-it:free
      - nvidia/nemotron-3.5-super-vl:free

  balanced:
    writer:
      - anthropic/claude-sonnet-5.5
      - anthropic/claude-sonnet-5
    checker:
      - google/gemini-3.8-flash
      - google/gemini-3.7-flash
    small:
      - google/gemini-3.1-flash-lite
      - google/gemini-3.5-flash-lite
      - google/gemma-4-26b-a4b-it:free

# Web research (training lessons only, agent/research.py): OpenRouter's web plugin with Exa.
# Every search costs money, also on free models (about $0.007 with max_results 3).
research:
  engine: exa
  max_results: 3
  max_searches: 12      # per lesson run
  searches_per_idea: 2  # a second, reworded search only if the first found nothing usable
  open_ideas: 3         # open research: current guidance, data, incidents
  gap_ideas: 2          # after comparing the findings with the owner's material

# Interactive illustrations per lesson (agent/illustrations.py), per profile.
illustrations:
  free: 3
  balanced: 5

# The conversation around the flow (agent/conversation.py).
conversation:
  seconds_per_call:      # for the opening estimate, from the measured runs (day 9-10 free: ~55 s a call)
    free: 55
    balanced: 20
  thin_material_chars: 2500   # less owner material than this: the agent suggests more (web or a file)
  default_screens_min: 5      # the default length offered in the clarification: source units + 3,
  default_screens_max: 12     # within these bounds
  wide_research_ideas: 5      # open research ideas when the owner accepts a wider search (default 3)
