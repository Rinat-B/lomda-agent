<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סופרים עמודים בערפל</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:8px;background:#FFFFFF;color:#1F2933;font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.35}
.wrap{max-width:360px;width:100%;margin:0 auto}
h1{font-size:17px;margin:0 0 4px}
.scene{background:#F3F6F9;border:1px solid #C5CED8;border-radius:8px;overflow:hidden}
svg{display:block;width:100%;height:auto;max-height:150px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
label,legend{font-weight:bold;font-size:14px}
input[type=range]{flex:1;min-width:0;accent-color:#1D63A0}
.count{background:#FFF3BF;border:1px solid #C5CED8;border-radius:6px;padding:3px 8px;font-weight:bold}
fieldset{border:1px solid #C5CED8;border-radius:8px;margin:6px 0;padding:4px 8px;background:#F3F6F9}
.opts{display:flex;flex-wrap:wrap;gap:4px 12px}
.opts label{font-weight:normal;display:flex;align-items:center;gap:4px;padding:2px 0}
button{background:#1D63A0;color:#FFFFFF;border:0;border-radius:6px;padding:7px 14px;font-size:15px;cursor:pointer}
:focus-visible{outline:3px solid #1F2933;outline-offset:2px}
#out{margin-top:6px;min-height:40px;padding:6px 8px;border-radius:6px;border:1px solid #C5CED8;font-size:14px}
#out.ok{border-color:#1B6E3F;color:#1B6E3F}
#out.bad{border-color:#A9231A;color:#A9231A}
</style>
</head>
<body>
<div class="wrap">
<h1>סופרים עמודים בערפל</h1>
<div class="scene"><svg id="svg" viewBox="0 0 340 170" role="img" aria-label="כביש בין-עירוני בערפל עם עמודי תאורה במרחק של כ-50 מ׳ זה מזה"></svg></div>
<div class="row">
<label for="fog">צפיפות הערפל:</label>
<input type="range" id="fog" min="1" max="8" value="1">
<span class="count" id="cnt"></span>
</div>
<fieldset>
<legend>מה טווח הראות?</legend>
<div class="opts">
<label><input type="radio" name="r" value="over100"> מעל 100 מ׳</label>
<label><input type="radio" name="r" value="u100"> מתחת ל-100 מ׳</label>
<label><input type="radio" name="r" value="u50"> מתחת ל-50 מ׳</label>
</div>
</fieldset>
<button id="chk" type="button">בדיקת ההערכה</button>
<div id="out" aria-live="polite">הזיזו את המחוון, ספרו כמה עמודים נראים ובחרו טווח ראות.</div>
</div>
<script>
var VIS=[320,260,210,130,90,70,30,20];
var NS="http://www.w3.org/2000/svg";
var fog=document.getElementById('fog'),svg=document.getElementById('svg'),cnt=document.getElementById('cnt'),out=document.getElementById('out');
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function visible(){var v=VIS[fog.value-1],c=0;for(var k=1;k<=6;k++){if(50*k<=v)c++;}return c;}
function draw(){
 var lvl=+fog.value,n=visible();
 svg.innerHTML='';
 var defs=el('defs',{});
 var g=el('linearGradient',{id:'sky',x1:0,y1:0,x2:0,y2:1},defs);
 el('stop',{offset:'0','stop-color':'#E4EAF0'},g);el('stop',{offset:'1','stop-color':'#F3F6F9'},g);
 el('rect',{x:0,y:0,width:340,height:70,fill:'url(#sky)'});
 el('rect',{x:0,y:70,width:340,height:100,fill:'#DDE5DD'});
 el('polygon',{points:'165,70 175,70 290,170 50,170',fill:'#7A8591'});
 for(var i=0;i<5;i++){var t=i/5,t2=(i+0.5)/5;var y1=75+t*t*95,y2=75+t2*t2*95;
  el('polygon',{points:(169-0.5-t*3)+','+y1+' '+(171+0.5+t*3)+','+y1+' '+(171+t2*4+1)+','+y2+' '+(169-t2*4-1)+','+y2,fill:'#FFFFFF',opacity:0.8});}
 for(var k=6;k>=1;k--){
  var d=50*k,s=1/(1+d/60),by=70+120*s,h=95*s,x=170+(105*s+18*s*1.5);
  var vis=k<=n;
  var gr=el('g',{opacity:vis?1:0.04});
  el('line',{x1:x,y1:by,x2:x,y2:by-h,stroke:'#1F2933','stroke-width':Math.max(1.5,4*s)},gr);
  el('line',{x1:x,y1:by-h,x2:x-14*s*1.5,y2:by-h,stroke:'#1F2933','stroke-width':Math.max(1.5,3*s)},gr);
  el('circle',{cx:x-14*s*1.5,cy:by-h+2,r:Math.max(2,5*s),fill:'#FFD84D',stroke:'#1F2933','stroke-width':1},gr);
  if(vis){var tx=el('text',{x:x+8,y:by-h/2,'font-size':11,fill:'#1F2933','font-weight':'bold'},gr);tx.textContent=k;}
 }
 el('rect',{x:0,y:0,width:340,height:170,fill:'#EEF1F4',opacity:Math.min(0.9,0.05+lvl*0.11)});
 el('rect',{x:140,y:150,width:60,height:20,rx:5,fill:'#1D63A0'});
 var c=el('text',{x:170,y:164,'font-size':11,fill:'#FFFFFF','text-anchor':'middle'});c.textContent='אתם';
 cnt.textContent='עמודים נראים: '+n;
}
function reset(){out.className='';out.textContent='הערפל השתנה. ספרו את העמודים ובחרו טווח ראות.';}
fog.addEventListener('input',function(){draw();reset();});
document.getElementById('chk').addEventListener('click',function(){
 var sel=document.querySelector('input[name=r]:checked');
 if(!sel){out.className='';out.textContent='קודם בחרו טווח ראות.';return;}
 var n=visible(),right,why;
 if(n>=2){right='over100';why='רואים '+n+' עמודים, שני עמודים או יותר, והמרחק בין עמוד לעמוד כ-50 מ׳, ולכן הראות מעל 100 מ׳.';}
 else if(n===1){right='u100';why='רואים עמוד אחד בלבד, פחות משני עמודים, ולכן הראות מתחת ל-100 מ׳.';}
 else{right='u50';why='לא רואים אף עמוד, אפילו לא את הראשון במרחק של כ-50 מ׳, ולכן הראות מתחת ל-50 מ׳.';}
 if(sel.value===right){out.className='ok';out.textContent='ההערכה נכונה. '+why;}
 else{var names={over100:'מעל 100 מ׳',u100:'מתחת ל-100 מ׳',u50:'מתחת ל-50 מ׳'};
  out.className='bad';out.textContent='ההערכה אינה מדויקת. '+why+' ההערכה הנכונה: '+names[right]+'.';}
});
draw();
</script>
</body>
</html>
